<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="540" viewBox="0 0 1280 540" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" role="img" aria-labelledby="title"><title id="title">The setup container serves the browser wizard and publishes to the MQTT broker; the reader container reads the selected disks without network; they share a RAM-backed snapshot.</title><defs><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#5d7a8e"/></marker></defs><rect x="400" y="26" width="360" height="488" rx="18" fill="#f4f9fd" stroke="#8fb0c7" stroke-width="1.5" stroke-dasharray="7 6"/><text x="580" y="52" text-anchor="middle" dominant-baseline="central" fill="#466376" font-size="13.5" font-weight="600">One UGOS Docker project</text><rect x="30" y="80" width="210" height="84" rx="12" fill="#ffffff" stroke="#aac9dc" stroke-width="1.5"/><text x="135.0" y="111.0" text-anchor="middle" dominant-baseline="central" fill="#15344a" font-size="18" font-weight="600">Browser</text><text x="135.0" y="136.0" text-anchor="middle" dominant-baseline="central" fill="#466376" font-size="13.5">on your trusted LAN</text><rect x="30" y="400" width="210" height="84" rx="12" fill="#ffffff" stroke="#aac9dc" stroke-width="1.5"/><text x="135.0" y="431.0" text-anchor="middle" dominant-baseline="central" fill="#15344a" font-size="18" font-weight="600">Disks and volumes</text><text x="135.0" y="456.0" text-anchor="middle" dominant-baseline="central" fill="#466376" font-size="13.5">SATA, chosen in the wizard</text><rect x="420" y="80" width="320" height="84" rx="12" fill="#e3f0fa" stroke="#3176ae" stroke-width="1.5"/><text x="580.0" y="111.0" text-anchor="middle" dominant-baseline="central" fill="#15344a" font-size="18" font-weight="700">setup</text><text x="580.0" y="136.0" text-anchor="middle" dominant-baseline="central" fill="#466376" font-size="13.5">wizard + MQTT publisher · no disk access</text><rect x="470" y="248" width="220" height="68" rx="12" fill="#ffffff" stroke="#aac9dc" stroke-width="1.5"/><text x="580.0" y="271.0" text-anchor="middle" dominant-baseline="central" fill="#15344a" font-size="18" font-weight="600">RAM-backed snapshot</text><text x="580.0" y="296.0" text-anchor="middle" dominant-baseline="central" fill="#466376" font-size="13.5">targets and readings</text><rect x="420" y="400" width="320" height="84" rx="12" fill="#e3f0fa" stroke="#3176ae" stroke-width="1.5"/><text x="580.0" y="431.0" text-anchor="middle" dominant-baseline="central" fill="#15344a" font-size="18" font-weight="700">reader</text><text x="580.0" y="456.0" text-anchor="middle" dominant-baseline="central" fill="#466376" font-size="13.5">SMART + volume space · no network</text><rect x="890" y="80" width="170" height="84" rx="12" fill="#ffffff" stroke="#aac9dc" stroke-width="1.5"/><text x="975.0" y="111.0" text-anchor="middle" dominant-baseline="central" fill="#15344a" font-size="18" font-weight="600">MQTT broker</text><text x="975.0" y="136.0" text-anchor="middle" dominant-baseline="central" fill="#466376" font-size="13.5">yours</text><rect x="1100" y="80" width="160" height="84" rx="12" fill="#ffffff" stroke="#aac9dc" stroke-width="1.5"/><text x="1180.0" y="111.0" text-anchor="middle" dominant-baseline="central" fill="#15344a" font-size="18" font-weight="600">Home Assistant</text><text x="1180.0" y="136.0" text-anchor="middle" dominant-baseline="central" fill="#466376" font-size="13.5">MQTT Discovery</text><line x1="240" y1="122" x2="416" y2="122" stroke="#5d7a8e" stroke-width="2" marker-end="url(#head)"/><text x="320" y="108" text-anchor="middle" dominant-baseline="central" fill="#466376" font-size="13.5">token, settings</text><line x1="240" y1="442" x2="416" y2="442" stroke="#5d7a8e" stroke-width="2" marker-end="url(#head)"/><text x="320" y="428" text-anchor="middle" dominant-baseline="central" fill="#466376" font-size="13.5">read-only</text><line x1="740" y1="122" x2="886" y2="122" stroke="#5d7a8e" stroke-width="2" marker-end="url(#head)"/><text x="825" y="108" text-anchor="middle" dominant-baseline="central" fill="#466376" font-size="13.5">MQTT, outbound</text><line x1="1060" y1="122" x2="1096" y2="122" stroke="#5d7a8e" stroke-width="2" marker-end="url(#head)"/><line x1="540" y1="164" x2="540" y2="244" stroke="#5d7a8e" stroke-width="2" marker-end="url(#head)"/><text x="530" y="204.0" text-anchor="end" dominant-baseline="central" fill="#466376" font-size="13.5">targets</text><line x1="620" y1="244" x2="620" y2="168" stroke="#5d7a8e" stroke-width="2" marker-end="url(#head)"/><text x="630" y="206.0" text-anchor="start" dominant-baseline="central" fill="#466376" font-size="13.5">readings</text><line x1="540" y1="316" x2="540" y2="396" stroke="#5d7a8e" stroke-width="2" marker-end="url(#head)"/><text x="530" y="356.0" text-anchor="end" dominant-baseline="central" fill="#466376" font-size="13.5">targets</text><line x1="620" y1="400" x2="620" y2="320" stroke="#5d7a8e" stroke-width="2" marker-end="url(#head)"/><text x="630" y="360.0" text-anchor="start" dominant-baseline="central" fill="#466376" font-size="13.5">readings</text></svg>
