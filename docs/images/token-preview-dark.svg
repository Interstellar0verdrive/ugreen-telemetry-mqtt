<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" font-family="Arial, Helvetica, sans-serif" aria-label="UGREEN Telemetry UI mockup, dark theme">
<defs><filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feGaussianBlur stdDeviation="17"/></filter><linearGradient id="back" x2="1" y2="1"><stop stop-color="#0c2033"/><stop offset="1" stop-color="#10283d"/></linearGradient></defs>
<rect x="0" y="0" width="1200" height="600" rx="0" fill="url(#back)" stroke="none" />
<rect x="82" y="71" width="1036" height="470" rx="23" fill="#020a12" stroke="none" opacity=".25" filter="url(#shadow)"/>
<rect x="70" y="54" width="1060" height="500" rx="22" fill="#172e43" stroke="#547b98" />
<rect x="100" y="65" width="1000" height="5" rx="2.5" fill="#258dcf" stroke="none" />
<text x="100" y="99" fill="#f5fbff" font-size="29" font-weight="700" >UGREEN Telemetry</text>
<text x="100" y="124" fill="#c0d7e7" font-size="15" font-weight="400" >Configure which NAS readings to publish to your MQTT broker.</text>
<text x="100" y="205" fill="#f5fbff" font-size="24" font-weight="700" >Unlock setup</text>
<text x="100" y="233" fill="#c0d7e7" font-size="15" font-weight="400" >Enter the setup token to access this NAS&#x27;s telemetry settings.</text>
<rect x="100" y="267" width="481" height="188" rx="10" fill="#224b69" stroke="#547b98" />
<text x="121" y="305" fill="#258dcf" font-size="15" font-weight="700" >1.</text>
<text x="148" y="305" fill="#f5fbff" font-size="15" font-weight="500" >Open UGOS Docker and select the telemetry project.</text>
<text x="121" y="353" fill="#258dcf" font-size="15" font-weight="700" >2.</text>
<text x="148" y="353" fill="#f5fbff" font-size="15" font-weight="500" >Open the setup container, then its Logs tab.</text>
<text x="121" y="401" fill="#258dcf" font-size="15" font-weight="700" >3.</text>
<text x="148" y="401" fill="#f5fbff" font-size="15" font-weight="500" >On the Setup token line, copy only the</text>
<text x="148" y="423" fill="#f5fbff" font-size="15" font-weight="500" >43-character code after the colon, without spaces.</text>
<text x="620" y="291" fill="#f5fbff" font-size="15" font-weight="700" >Setup token</text>
<rect x="620" y="306" width="469" height="52" rx="9" fill="#10253a" stroke="#547b98" />
<text x="637" y="339" fill="#c0d7e7" font-size="16" font-weight="400" >Enter setup token</text>
<path d="M1057 333 q13 -15 26 0 q-13 15 -26 0 M1061 321 l23 24" fill="none" stroke="#c0d7e7" stroke-width="2" stroke-linecap="round"/>
<text x="620" y="382" fill="#c0d7e7" font-size="13" font-weight="400" >The token is shown only in the setup container&#x27;s log. Keep it private.</text>
<rect x="955" y="406" width="134" height="46" rx="9" fill="#258dcf" stroke="none" />
<text x="1022" y="435" fill="#ffffff" font-size="15" font-weight="700" text-anchor="middle">Continue</text>
<line x1="100" y1="480" x2="1090" y2="480" stroke="#547b98"/>
<text x="100" y="507" fill="#c0d7e7" font-size="13" font-weight="400" >This setup page uses local HTTP. Enter a token or broker password only on a trusted local network.</text>
</svg>
