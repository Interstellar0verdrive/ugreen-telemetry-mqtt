# Optional overlay after the host helper has been installed and its snapshot path
# has been tested. Run with: docker compose -f compose.yaml -f compose.smart.yaml up -d
services:
  telemetry:
    environment:
      HDD_ENABLED: "true"
      EXPECTED_HDD_COUNT: ${EXPECTED_HDD_COUNT:?set EXPECTED_HDD_COUNT in .env}
      SMART_SNAPSHOT_FILE: /run/smart-snapshots/telemetry.json
    volumes:
      - ${SMART_SNAPSHOT_DIR:?set SMART_SNAPSHOT_DIR}:/run/smart-snapshots:ro
