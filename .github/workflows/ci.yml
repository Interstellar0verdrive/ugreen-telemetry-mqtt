name: Verify

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install package and MQTT client
        run: python -m pip install .
      - name: Run simulated sensor and MQTT tests
        run: PYTHONPATH=src python -m unittest discover -s tests -v
      - name: Check Python syntax
        run: python -m compileall -q src

  multiarch-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build the amd64 image without publishing
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: ugreen-telemetry-smoke:amd64
          cache-from: type=gha,scope=amd64
          cache-to: type=gha,mode=max,scope=amd64
      - name: Build the arm64 image without publishing
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          load: true
          tags: ugreen-telemetry-smoke:arm64
          cache-from: type=gha,scope=arm64
          cache-to: type=gha,mode=max,scope=arm64
      - name: Start both services on amd64 and arm64
        run: |
          tools/smoke_test_image.sh ugreen-telemetry-smoke:amd64 linux/amd64
          tools/smoke_test_image.sh ugreen-telemetry-smoke:arm64 linux/arm64
